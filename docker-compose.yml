services:
  log-generator:
    build: ./log-generator
    container_name: log-generator
    restart: unless-stopped
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - llm-network

  llm-service:
    build: ./llm-service
    container_name: llm-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LOG_GENERATOR_URL=http://log-generator:5000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-120b}
    depends_on:
      log-generator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - llm-network

  web-interface:
    build: ./web-interface
    container_name: web-interface
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      llm-service:
        condition: service_healthy
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
