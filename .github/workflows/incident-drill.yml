name: AIOps Incident Drill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: Failure scenario to replay through the live Compose stack
        required: true
        type: choice
        default: database_failure
        options:
          - database_failure
          - auth_breach
          - memory_leak
          - api_overload
          - disk_failure
          - redis_cache_stampede

permissions:
  contents: read

jobs:
  incident-drill:
    name: Analyze a simulated incident
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        run: python -m pip install -r llm-service/requirements.txt -r log-generator/requirements.txt

      - name: Run unit and scenario coverage
        run: python -m pytest -p no:cacheprovider llm-service log-generator scripts

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Select incident scenario
        id: scenario
        env:
          REQUESTED_SCENARIO: ${{ github.event.inputs.scenario }}
        shell: bash
        run: |
          if [[ -n "$REQUESTED_SCENARIO" ]]; then
            echo "scenario=$REQUESTED_SCENARIO" >> "$GITHUB_OUTPUT"
          else
            echo "scenario=database_failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and start all project containers
        run: docker compose up -d --build

      - name: Run the AIOps incident drill
        run: >-
          python scripts/incident_drill.py
          --scenario "${{ steps.scenario.outputs.scenario }}"
          --report incident-report.json

      - name: Save incident report
        if: always() && hashFiles('incident-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: incident-report-${{ steps.scenario.outputs.scenario }}
          path: incident-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop project containers
        if: always()
        run: docker compose down --remove-orphans
