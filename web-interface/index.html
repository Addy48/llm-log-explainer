<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Log Explainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <h1>LLM Log Explainer</h1>
                <p class="subtitle">Real-time log classification and root cause analysis</p>
            </div>
            <div class="header-right">
                <span id="service-status" class="status offline">✗ Offline</span>
            </div>
        </header>

        <div class="controls-section">
            <div class="button-group">
                <button id="generate-btn" class="btn btn-primary" onclick="generateRandomLog()">⚡ Generate Log</button>
                <button id="refresh-btn" class="btn btn-secondary" onclick="refreshPage()">↻ Refresh</button>
                <button id="clear-btn" class="btn btn-danger" onclick="clearAll()">✕ Clear All</button>
            </div>

            <div class="scenarios-section">
                <h3>Failure Scenarios</h3>
                <div class="scenario-buttons">
                    <button class="scenario-btn" onclick="analyzeScenario('database_failure')">📊 Database Failure</button>
                    <button class="scenario-btn" onclick="analyzeScenario('auth_breach')">🔐 Auth Breach</button>
                    <button class="scenario-btn" onclick="analyzeScenario('memory_leak')">💾 Memory Leak</button>
                    <button class="scenario-btn" onclick="analyzeScenario('api_overload')">⚠️ API Overload</button>
                    <button class="scenario-btn" onclick="analyzeScenario('disk_failure')">💿 Disk Failure</button>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="panel logs-panel">
                <div class="panel-header">
                    <h2>Application Logs</h2>
                    <span id="logs-count" class="count-badge">0 logs</span>
                </div>
                <div id="logs-container" class="logs-list">
                    <div class="empty-state">No logs yet. Click "Generate Log" to start.</div>
                </div>
            </div>

            <div class="panel analysis-panel">
                <div class="panel-header">
                    <h2>Analysis & Insights</h2>
                    <span id="explanations-count" class="count-badge">0 analyzed</span>
                </div>
                <div id="explanations-container" class="explanations-list">
                    <div class="empty-state">Explanations appear here.</div>
                </div>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Processing logs...</p>
        </div>
        <div id="error-message" class="error-message hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
